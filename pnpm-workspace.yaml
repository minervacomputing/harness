# One pnpm workspace for the Worker and its API contract (one lockfile, here).
# `pnpm install` anywhere in it installs both.
packages:
  - contract
  - cloudflare

# pnpm 10 reads onlyBuiltDependencies; pnpm 11 reads allowBuilds.
onlyBuiltDependencies:
  - esbuild
  - workerd
allowBuilds:
  esbuild: true
  workerd: true

# Bounds what a forged sandbox-shim answer can make the Worker allocate: a data frame at 16 MiB (45 bytes for a
# stat) instead of up to 4 GiB, and a directory listing at 100,000 entries.
patchedDependencies:
  '@cloudflare/sandbox@1.0.0': cloudflare/patches/@cloudflare__sandbox@1.0.0.patch
  # Drops the module-scope preloadSchemas() call from the workerd shim: the Worker never uses MCP (it comes with the
  # agents package's Agent class), and building every MCP wire schema at startup counts against the Worker's
  # startup CPU limit (cloudflare/README.md, Startup). The schemas are still built, lazily, on first use.
  '@modelcontextprotocol/client@2.0.0': cloudflare/patches/@modelcontextprotocol__client@2.0.0.patch
