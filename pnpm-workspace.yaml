# One pnpm workspace for the Worker, the frontend and the API contract they share (one lockfile, here).
# `pnpm install` anywhere in it installs all three.
packages:
  - contract
  - cloudflare
  - frontend

# pnpm 10 reads onlyBuiltDependencies; pnpm 11 reads allowBuilds.
onlyBuiltDependencies:
  - esbuild
  - workerd
allowBuilds:
  esbuild: true
  workerd: true

# Bounds what a forged sandbox-shim answer can make the Worker allocate: a data frame at 16 MiB (45 bytes for a
# stat) instead of up to 4 GiB, and a directory listing at 100,000 entries.
patchedDependencies:
  '@cloudflare/sandbox@1.0.0': cloudflare/patches/@cloudflare__sandbox@1.0.0.patch
