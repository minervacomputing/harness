[project]
name = "minerva"
version = "0.1.0"
description = "Minerva trusted backend: accounts, workspaces, connections, permissions, gateway, and run supervision"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "django>=6.1.1",
    "django-allauth[mfa]>=65.19.5",
    "django-ninja>=1.7.1",
    "docker>=7.2.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "psycopg[binary,pool]>=3.3.6",
    "publicsuffixlist>=1.0.2.20260925",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM", "RUF", "ASYNC", "S"]
ignore = ["RUF012", "S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "minerva.settings"
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--reuse-db"
