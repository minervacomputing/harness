# The account suites against the CI-only test instance minerva-cf-ci: nightly when
# the engine changed that day, and by hand (`gh workflow run account.yml --ref main`). A deploy of staging or
# production needs a green run on its engine (cloudflare/scripts/ci-gate.ts). Not on every push: they deploy a Worker
# and probe it from outside, which is slow and at the mercy of the rollout. Third-party actions are pinned to commits;
# update them deliberately.
name: account

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  account:
    # A deploy of the test build, then test:deployed and test:faults. The instance's directory exists only in the
    # ci-instance environment's secrets, which only main can read. Runs queue rather than cancel: a suite stopped
    # midway leaves its containers running. Nothing is uploaded: the logs and artifacts of this repository are public.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: ci-instance
    concurrency:
      group: account-suites
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    env:
      MINERVA_INSTANCE: minerva-cf-ci
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: fresh
        # A nightly run is skipped when the day's commits changed none of the engine's paths; a manual run always runs.
        # A failure to read the history runs it.
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = schedule ] && changed=$(git log --since="25 hours ago" --format=%H -- \
            cloudflare contract .github/workflows package.json pnpm-lock.yaml pnpm-workspace.yaml) && [ -z "$changed" ]; then
            echo "Nothing in the engine changed since the last nightly run."
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.fresh.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloudflare/package.json
      - if: steps.fresh.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - if: steps.fresh.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: The instance's directory, with every value a log could show masked first
        if: steps.fresh.outputs.run == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINERVA_CI_SECRETS_ENV: ${{ secrets.MINERVA_CI_SECRETS_ENV }}
          MINERVA_CI_VARS_ENV: ${{ secrets.MINERVA_CI_VARS_ENV }}
        run: |
          echo "MINERVA_INSTANCES_DIR=$RUNNER_TEMP/instances" >> "$GITHUB_ENV"
          MINERVA_INSTANCES_DIR="$RUNNER_TEMP/instances" node scripts/ci-instance.ts --instance "$MINERVA_INSTANCE"
      - name: Deploy the test build
        if: steps.fresh.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:test --instance "$MINERVA_INSTANCE"
      - name: The instance as deployed
        if: steps.fresh.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm test:deployed --instance "$MINERVA_INSTANCE"
      - name: The fault suites
        if: steps.fresh.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm test:faults --instance "$MINERVA_INSTANCE"
      - if: always() && steps.fresh.outputs.run == 'true'
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/instances"
