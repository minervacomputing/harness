# Every push to main: test, build the three images once (tagged with the commit), and deploy them to
# staging. See deploy/README.md. Third-party actions are pinned to commits; update them deliberately.
name: main

# No manual trigger: a run on another branch would move the :main tags. To retry, re-run the jobs.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: minerva
          POSTGRES_PASSWORD: minerva
          POSTGRES_DB: minerva
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minerva"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Throwaway values: the backend does not start without them.
      MINERVA_SECRET_KEY: ci-only-not-a-secret
      MINERVA_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: worker/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            worker/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Install
        run: |
          (cd backend && uv sync --frozen)
          (cd worker && pnpm install --frozen-lockfile)
          (cd frontend && pnpm install --frozen-lockfile)
      - run: make lint
      - run: make test

  images:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: minerva-backend
            context: backend
            file: deploy/Dockerfile.backend
          - name: minerva-proxy
            context: frontend
            file: deploy/Dockerfile.frontend
            build-contexts: deploy=deploy
          - name: minerva-worker
            context: worker
            file: worker/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A commit's images are built once: a re-run keeps what an earlier run pushed (and may have deployed).
      - name: Already built?
        id: built
        env:
          IMAGE: ghcr.io/minervacomputing/${{ matrix.name }}:${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::notice::$IMAGE exists; not rebuilt"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.built.outputs.exists != 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.build-contexts }}
          push: true
          # Deploys use the commit's tag; :main only tells a reader of the registry which is newest.
          tags: |
            ghcr.io/minervacomputing/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/minervacomputing/${{ matrix.name }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-staging:
    needs: images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions: {}
    environment:
      name: staging
      url: https://staging.minervacomputing.com
    # One deploy at a time, never cancelled halfway; GitHub keeps only the newest waiting.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice::Staging has no deploy key yet: deploy/ops.sh staging ci-key"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command runs minerva-deploy with this commit and nothing else.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "root@$DEPLOY_HOST" "$GITHUB_SHA"
