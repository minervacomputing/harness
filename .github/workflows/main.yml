# Every push to main: the engine's checks, which reach no Cloudflare account. The account suites run nightly and
# by hand (account.yml). Production is deployed by hand (cloudflare/README.md). Third-party actions are pinned to
# commits; update them deliberately.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    # The types of the contract and the engine, and the engine's unit tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloudflare/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Contract types, and its OpenAPI documents up to date
        working-directory: contract
        run: pnpm typecheck && pnpm openapi:check
      - name: Engine types
        working-directory: cloudflare
        run: pnpm typecheck
      - name: Engine unit tests (with the rules on the sources)
        working-directory: cloudflare
        run: pnpm test:unit

  platform:
    # The Worker in local workerd: Durable Objects, D1 and R2 simulated, remote bindings off, and the protocols'
    # fault tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloudflare/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Engine platform tests
        working-directory: cloudflare
        run: pnpm test:platform
