# Every push to main: the engine's checks, which reach no Cloudflare account, then, when the push changed the
# engine, the account suites against the CI-only test instance (job account, with the
# ci-instance environment's secrets; docs/plans/ci-account-suites.md). Production is deployed by hand
# (cloudflare/README.md). Third-party actions are pinned to commits; update them deliberately.
name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  # The paths whose changes run the account suites (jobs changes and account), as an extended regex on a path.
  ACCOUNT_PATHS: '^(cloudflare/|contract/|\.github/workflows/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'

jobs:
  check:
    # The types of the contract and the engine, and the engine's unit tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloudflare/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Contract types, and its OpenAPI documents up to date
        working-directory: contract
        run: pnpm typecheck && pnpm openapi:check
      - name: Engine types
        working-directory: cloudflare
        run: pnpm typecheck
      - name: Engine unit tests (with the rules on the sources)
        working-directory: cloudflare
        run: pnpm test:unit

  platform:
    # The Worker in local workerd: Durable Objects, D1 and R2 simulated, remote bindings off, and the protocols'
    # fault tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloudflare/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Engine platform tests
        working-directory: cloudflare
        run: pnpm test:platform

  changes:
    # Whether this push changed the engine, so that the account suites run (docs/plans/ci-account-suites.md):
    # a manual run always does, and so does a range that cannot be read.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # -z: paths unquoted, whatever their characters. Any failure leaves run=true.
          run=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git diff -z --name-only --no-renames "$BEFORE" "$SHA" > "$RUNNER_TEMP/changed"; then
            grep -zqE "$ACCOUNT_PATHS" "$RUNNER_TEMP/changed" || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Account suites: $run"

  account:
    # The account suites against the CI-only test instance (docs/plans/ci-account-suites.md): a deploy of the test
    # build, then test:deployed and test:faults. The instance's directory exists only in the
    # ci-instance environment's secrets, which only main can read. Runs queue rather than cancel: a suite stopped
    # midway leaves its containers running. Nothing is uploaded: the logs and artifacts of this repository are public.
    needs: [check, platform, changes]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: ci-instance
    concurrency:
      group: account-suites
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    env:
      MINERVA_INSTANCE: minerva-cf-ci
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: fresh
        # Queued runs do not start in push order. A push is skipped when main has moved past it with commits that
        # change the account paths themselves, since the run of the newest such commit tests them; commits that
        # change none (docs) do not skip it, as their own runs skip the suites. A failure to read main runs it.
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          run=true
          if [ "$EVENT" = push ] && git fetch --quiet --no-tags origin main && tip=$(git rev-parse FETCH_HEAD) \
            && [ "$tip" != "$SHA" ] && git diff -z --name-only --no-renames "$SHA" "$tip" > "$RUNNER_TEMP/newer" \
            && grep -zqE "$ACCOUNT_PATHS" "$RUNNER_TEMP/newer"; then
            echo "main has moved past this commit with changes to the engine; the newer run tests them."
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.fresh.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloudflare/package.json
      - if: steps.fresh.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - if: steps.fresh.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: The instance's directory, with every value a log could show masked first
        if: steps.fresh.outputs.run == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MINERVA_CI_SECRETS_ENV: ${{ secrets.MINERVA_CI_SECRETS_ENV }}
          MINERVA_CI_VARS_ENV: ${{ secrets.MINERVA_CI_VARS_ENV }}
        run: |
          echo "MINERVA_INSTANCES_DIR=$RUNNER_TEMP/instances" >> "$GITHUB_ENV"
          MINERVA_INSTANCES_DIR="$RUNNER_TEMP/instances" node scripts/ci-instance.ts --instance "$MINERVA_INSTANCE"
      - name: Deploy the test build
        if: steps.fresh.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:test --instance "$MINERVA_INSTANCE"
      - name: The instance as deployed
        if: steps.fresh.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm test:deployed --instance "$MINERVA_INSTANCE"
      - name: The fault suites
        if: steps.fresh.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm test:faults --instance "$MINERVA_INSTANCE"
      - if: always() && steps.fresh.outputs.run == 'true'
        working-directory: .
        run: rm -rf "$RUNNER_TEMP/instances"
