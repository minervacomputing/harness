# Local development services. The backend and frontend run on the host (see README).
name: minerva-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: minerva
      POSTGRES_PASSWORD: minerva
      POSTGRES_DB: minerva
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minerva"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Workers have no network. Their one way out is this relay's Unix socket, in a volume they mount
  # read-only, and it forwards to one port: the gateway running on the host.
  gateway-socket:
    image: alpine/socat:1.8.0.3
    command:
      - UNIX-LISTEN:/run/minerva/gateway/gateway.sock,fork,unlink-early,user=1000,group=1000,mode=600,max-children=128
      - TCP:host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gateway-socket:/run/minerva/gateway
    read_only: true
    cap_drop: [ALL]
    # To hand the socket to the workers' user, then set its mode.
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges]
    mem_limit: 128m
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/minerva/gateway/gateway.sock"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  # Created here, under a fixed name, so the supervisor finds it. It holds only the gateway socket.
  gateway-socket:
    name: minerva-gateway-socket
